
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>欢迎来到林创造的方块空间</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    color:#fff;
    font-family:Arial,sans-serif;
    padding:20px 40px 40px 40px;
    background:transparent;
    position:relative;
    min-height:100vh;
    overflow-x:hidden;
}
#rainCanvas,#blockBreakCanvas,#petalCanvas,#sparkleCanvas{
    position:fixed;
    inset:0;
    pointer-events:none;
}
#rainCanvas{z-index:1;}
#blockBreakCanvas{z-index:2;}
#petalCanvas{z-index:3;}
#sparkleCanvas{z-index:4;}

.bg-wallpaper{
    position:fixed;
    inset:0;
    z-index:0;
    background-image:url("https://picx.zhimg.com/v2-81b68bd2173432b28ab6ea5c544b8f01_r.jpg");
    background-size:cover;
    background-position:center 28%;
    background-repeat:no-repeat;
    background-attachment:fixed;
}
.bg-wallpaper::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(20,10,30,0.35);
}

.content-wrap{
    position:relative;
    z-index:10;
    padding-top:68vh;
}
h1{
    text-align:center;
    margin-bottom:40px;
    opacity:0.92;
    font-size:36px;
    letter-spacing:3px;
    text-shadow:0 0 18px rgba(255,105,180,0.95),0 0 36px rgba(255,20,147,0.6);
    color:#ffe4ec;
    animation:titleGlow 2.5s ease-in-out infinite;
}
@keyframes titleGlow{
    0%,100%{filter:drop-shadow(0 0 18px rgba(255,105,180,0.95));}
    50%{filter:drop-shadow(0 0 28px rgba(255,20,147,0.8)) drop-shadow(0 0 50px rgba(255,192,203,0.5));}
}

.box{
    max-width:820px;
    margin:0 auto;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:18px;
}
.item{
    padding:22px 10px;
    border-radius:12px;
    text-align:center;
    background:rgba(255,105,180,0.08);
    border:1px solid rgba(255,105,180,0.25);
    backdrop-filter:blur(3px);
    transition:0.25s;
}
.item:hover{
    transform:scale(1.02);
    background:rgba(255,105,180,0.18);
    box-shadow:0 0 22px rgba(255,105,180,0.35);
}
a{
    color:#ffebf2;
    text-decoration:none;
    font-size:18px;
}

.music-box{
    position:fixed;
    left:16px;
    top:10px;
    z-index:20;
}
.music-btn{
    width:150px;
    padding:11px 0;
    font-size:15px;
    border-radius:30px;
    border:1px solid rgba(255,105,180,0.25);
    background:rgba(255,105,180,0.12);
    color:#fff;
    cursor:pointer;
    backdrop-filter:blur(6px);
}
.music-btn:hover{
    background:rgba(255,105,180,0.24);
    transform:scale(1.03);
    box-shadow:0 0 18px rgba(255,105,180,0.45);
}
.player-card{
    position:fixed;
    left:16px;
    top:10px;
    width:340px;
    z-index:30;
    padding:16px 18px;
    border-radius:18px;
    background:rgba(40,10,30,0.65);
    border:1px solid rgba(255,105,180,0.25);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:0 6px 24px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.1);
}
.player-card::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:19px;
    background:linear-gradient(135deg,rgba(255,105,180,0.35),rgba(255,20,147,0.25),rgba(255,215,0,0.2));
    z-index:-1;
    opacity:0.5;
}
.player-glow{
    position:absolute;
    top:-30px;
    left:50%;
    transform:translateX(-50%);
    width:200px;
    height:200px;
    background:radial-gradient(circle,rgba(255,105,180,0.3) 0%,transparent 70%);
    border-radius:50%;
    z-index:-1;
    animation:glowPulse 3s ease-in-out infinite;
}
.player-card.playing .player-glow{animation:glowPulse 1.2s ease-in-out infinite;}
@keyframes glowPulse{
    0%,100%{opacity:0.4;transform:translateX(-50%) scale(1);}
    50%{opacity:0.8;transform:translateX(-50%) scale(1.12);}
}
.player-main{display:flex;align-items:center;gap:16px;}
.disc-wrap{position:relative;width:90px;height:90px;flex-shrink:0;}
.disc{
    width:90px;height:90px;border-radius:50%;
    background:radial-gradient(circle at center,#2a2a3a 0%,#2a2a3a 18%,#111 19%,#1a1a2a 40%,#0a0a14 60%,#1a1a2a 80%,#0a0a14 100%);
    position:relative;
    box-shadow:0 0 0 3px rgba(255,255,255,0.06),0 4px 16px rgba(0,0,0,0.5),inset 0 0 20px rgba(0,0,0,0.6);
    animation:discSpin 8s linear infinite;
    animation-play-state:paused;
}
.player-card.playing .disc{animation-play-state:running;}
@keyframes discSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.disc::before{content:"";position:absolute;inset:8px;border-radius:50%;border:1px dashed rgba(255,255,255,0.08);}
.disc-center{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:30px;height:30px;border-radius:50%;
    background:linear-gradient(135deg,#ff69b4 0%,#ff1493 50%,#f59e0b 100%);
    box-shadow:0 0 10px rgba(255,105,180,0.6);
}
.disc-center::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:5px;height:5px;border-radius:50%;background:#111;}
.player-info{flex:1;min-width:0;}
.song-title{
    font-size:15px;font-weight:bold;margin-bottom:2px;
    background:linear-gradient(90deg,#ffc0cb,#ff9ec7,#ffd700);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.song-artist{font-size:11px;color:rgba(255,255,255,0.45);margin-bottom:8px;letter-spacing:1px;}
.visualizer{display:flex;align-items:flex-end;gap:2px;height:22px;margin-bottom:8px;}
.visualizer span{flex:1;background:linear-gradient(180deg,#ff69b4,#ff1493);border-radius:2px 2px 0 0;height:4px;}
.player-card.playing .visualizer span{animation:vizBar 0.8s ease-in-out infinite;}
.player-card.playing .visualizer span:nth-child(1){animation-delay:0s;}
.player-card.playing .visualizer span:nth-child(2){animation-delay:0.1s;}
.player-card.playing .visualizer span:nth-child(3){animation-delay:0.2s;}
.player-card.playing .visualizer span:nth-child(4){animation-delay:0.05s;}
.player-card.playing .visualizer span:nth-child(5){animation-delay:0.15s;}
.player-card.playing .visualizer span:nth-child(6){animation-delay:0.25s;}
.player-card.playing .visualizer span:nth-child(7){animation-delay:0.1s;}
.player-card.playing .visualizer span:nth-child(8){animation-delay:0.3s;}
@keyframes vizBar{0%,100%{height:4px;}50%{height:20px;}}
.progress-bar{
    position:relative;width:100%;height:4px;background:rgba(255,255,255,0.1);
    border-radius:2px;cursor:pointer;overflow:visible;margin-bottom:6px;
}
.progress-fill{
    position:absolute;left:0;top:0;height:100%;width:0%;
    background:linear-gradient(90deg,#ff69b4,#ff1493,#f59e0b);
    border-radius:2px;box-shadow:0 0 6px rgba(255,20,147,0.6);
}
.time-display{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,0.4);font-variant-numeric:tabular-nums;}
.controls{display:flex;align-items:center;gap:10px;margin-top:8px;}
.ctrl-btn{
    width:30px;height:30px;border-radius:50%;border:none;
    background:rgba(255,255,255,0.08);color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:all 0.2s;
}
.ctrl-btn:hover{background:rgba(255,255,255,0.18);transform:scale(1.1);}
.play-btn{
    width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#ff69b4 0%,#ff1493 100%);
    box-shadow:0 3px 14px rgba(255,105,180,0.5),inset 0 1px 0 rgba(255,255,255,0.3);
    transition:all 0.25s;
}
.play-btn:hover{transform:scale(1.1);box-shadow:0 4px 20px rgba(255,20,147,0.7);}
.play-btn:active{transform:scale(0.95);}
.play-btn .icon-play{width:0;height:0;border-left:12px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px;}
.play-btn .icon-pause{display:none;gap:4px;}
.play-btn .icon-pause::before,.play-btn .icon-pause::after{content:"";width:4px;height:14px;background:#fff;border-radius:2px;}
.player-card.playing .play-btn .icon-play{display:none;}
.player-card.playing .play-btn .icon-pause{display:flex;}
.volume-wrap{display:flex;align-items:center;gap:6px;margin-left:auto;}
.volume-slider{
    -webkit-appearance:none;appearance:none;width:55px;height:3px;
    background:rgba(255,255,255,0.15);border-radius:2px;outline:none;cursor:pointer;
}
.volume-slider::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:10px;height:10px;border-radius:50%;
    background:#fff;box-shadow:0 0 5px rgba(255,105,180,0.8);cursor:pointer;
}
.volume-slider::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#fff;border:none;box-shadow:0 0 5px rgba(255,105,180,0.8);cursor:pointer;}

/* 左侧角色 */
.girl-left{
    position:fixed;
    left:30px;
    bottom:20px;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:6px;
}
.girl-left .chat-bubble{
    max-width:230px;
    padding:10px 14px;
    background:linear-gradient(135deg,#f3e8ff 0%,#e8d4ff 100%);
    color:#5a189a;
    border-radius:16px 16px 16px 4px;
    font-size:13px;
    line-height:1.5;
    box-shadow:0 4px 14px rgba(138,43,226,0.35);
    opacity:0;
    transform:translateY(8px);
    transition:all 0.4s ease;
    pointer-events:none;
    position:relative;
}
.girl-left .chat-bubble::before{
    content:"";
    position:absolute;
    left:-5px;
    bottom:12px;
    width:10px;
    height:10px;
    background:#e8d4ff;
    transform:rotate(45deg);
}
.girl-left .chat-bubble.show{
    opacity:1;
    transform:translateY(0);
}
.girl-left .avatar{
    width:130px;
    height:170px;
    animation:floatLeft 3.2s ease-in-out infinite;
    user-select:none;
    filter:drop-shadow(0 6px 12px rgba(180,80,255,0.6));
    cursor:pointer;
    transition:transform 0.2s;
}
.girl-left .avatar:hover{transform:scale(1.05);}
@keyframes floatLeft{
    0%,100%{transform:translateY(0px);}
    50%{transform:translateY(-10px);}
}

/* 右侧角色 */
.girl-right{
    position:fixed;
    right:30px;
    bottom:20px;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
}
.girl-right .chat-bubble{
    max-width:230px;
    padding:10px 14px;
    background:rgba(255,240,250,0.95);
    color:#6b2f5c;
    border-radius:16px 16px 4px 16px;
    font-size:13px;
    line-height:1.5;
    box-shadow:0 4px 14px rgba(255,20,147,0.35);
    opacity:0;
    transform:translateY(8px);
    transition:all 0.4s ease;
    pointer-events:none;
    position:relative;
}
.girl-right .chat-bubble::before{
    content:"";
    position:absolute;
    right:-5px;
    bottom:12px;
    width:10px;
    height:10px;
    background:#ffe4ec;
    transform:rotate(45deg);
}
.girl-right .chat-bubble.show{
    opacity:1;
    transform:translateY(0);
}
.girl-right .avatar{
    width:130px;
    height:170px;
    animation:floatRight 3.2s ease-in-out infinite;
    user-select:none;
    filter:drop-shadow(0 6px 12px rgba(240,140,200,0.6));
    cursor:pointer;
    transition:transform 0.2s;
}
.girl-right .avatar:hover{transform:scale(1.05);}
@keyframes floatRight{
    0%,100%{transform:translateY(0px);}
    50%{transform:translateY(-10px);}
}

.hand-left{transform-origin:40px 92px;animation:waveL 2.4s ease-in-out infinite;}
.hand-right{transform-origin:80px 92px;animation:waveR 2.8s ease-in-out infinite;}
@keyframes waveL{
    0%,100%{transform:rotate(0deg);}
    50%{transform:rotate(-18deg);}
}
@keyframes waveR{
    0%,100%{transform:rotate(0deg);}
    50%{transform:rotate(18deg);}
}
.duo-hand{
    transform-origin:55px 85px;
    animation:duoHandWave 2.2s ease-in-out infinite;
}
@keyframes duoHandWave{
    0%,100%{transform:rotate(0deg);}
    50%{transform:rotate(20deg);}
}

.heart-float{
    position:fixed;
    z-index:99;
    pointer-events:none;
    font-size:20px;
    animation:heartFloatUp 1.8s ease-out forwards;
}
@keyframes heartFloatUp{
    0%{transform:translateY(0) scale(1);opacity:1;}
    100%{transform:translateY(-60px) scale(1.6);opacity:0;}
}
</style>
</head>

function makeMirrorCracks(radius){
    let cracks=[];
    let impactX=(Math.random()-0.5)*radius*0.3;
    let impactY=(Math.random()-0.5)*radius*0.3;
    let mainCount=5+Math.floor(Math.random()*4);
    for(let i=0;i<mainCount;i++){
        let baseA=(Math.PI*2/mainCount)*i+(Math.random()-0.5)*0.5;
        let pts=[{x:impactX,y:impactY}];
        let curA=baseA;
        let curR=0;
        let steps=4+Math.floor(Math.random()*3);
        for(let s=0;s<steps;s++){
            curA+=(Math.random()-0.5)*0.7;
            curR+=radius*(0.2+Math.random()*0.18);
            if(curR>radius*1.1)curR=radius*1.1;
            pts.push({x:impactX+Math.cos(curA)*curR,y:impactY+Math.sin(curA)*curR});
        }
        cracks.push({pts:pts,main:true});
        let branchCount=1+Math.floor(Math.random()*2);
        for(let b=0;b<branchCount;b++){
            let bi=1+Math.floor(Math.random()*(pts.length-2));
            let bp=pts[bi];
            let bA=curA+(Math.random()>0.5?1:-1)*(0.4+Math.random()*0.6);
            let bPts=[{x:bp.x,y:bp.y}];
            let bR=0;
            let bSteps=2+Math.floor(Math.random()*2);
            for(let bs=0;bs<bSteps;bs++){
                bA+=(Math.random()-0.5)*0.5;
                bR+=radius*(0.12+Math.random()*0.15);
                bPts.push({x:bp.x+Math.cos(bA)*bR,y:bp.y+Math.sin(bA)*bR});
            }
            cracks.push({pts:bPts,main:false});
        }
    }
    return {cracks:cracks,impact:{x:impactX,y:impactY}};
}
function makeMirrorShards(crackData,radius){
    let shards=[];
    let angles=[];
    for(let c of crackData.cracks){
        if(c.main && c.pts.length>1){
            let p=c.pts[1];
            angles.push(Math.atan2(p.y-crackData.impact.y,p.x-crackData.impact.x));
        }
    }
    angles.sort(function(a,b){return a-b;});
    for(let i=0;i<angles.length;i++){
        let a1=angles[i];
        let a2=angles[(i+1)%angles.length];
        if(a2<a1)a2+=Math.PI*2;
        let mid=(a1+a2)/2;
        let pts=[{x:crackData.impact.x,y:crackData.impact.y}];
        let steps=4+Math.floor(Math.random()*2);
        for(let s=0;s<=steps;s++){
            let a=a1+(a2-a1)*(s/steps);
            let r=radius*(0.7+Math.random()*0.4);
            let jitter=(Math.random()-0.5)*radius*0.15;
            pts.push({
                x:crackData.impact.x+Math.cos(a)*(r+jitter),
                y:crackData.impact.y+Math.sin(a)*(r+jitter)
            });
        }
        shards.push({
            pts:pts,
            dirA:mid,
            dist:0,
            rot:Math.random()*Math.PI,
            rotSpeed:(Math.random()-0.5)*0.07,
            speed:1.2+Math.random()*2.5,
            highlight:Math.random()
        });
    }
    return shards;
}
class MirrorBreak{
    constructor(){
        this.x=Math.random()*blockCanvas.width;
        this.y=Math.random()*blockCanvas.height;
        this.size=Math.random()*110+75;
        this.baseSize=this.size;
        this.vx=(Math.random()-0.5)*1.0;
        this.vy=(Math.random()-0.5)*1.0;
        this.rotate=Math.random()*Math.PI*2;
        this.rotSpeed=(Math.random()-0.5)*0.018;
        this.life=1;
        this.phase=Math.random()*100;
        this.sides=4;
        this.targetSides=4;
        this.crackData=null;
        this.shards=null;
        this.crackProgress=0;
        this.shardProgress=0;
        this.voidProgress=0;
        this.stars=[];
        for(let i=0;i<40;i++){
            this.stars.push({
                a:Math.random()*Math.PI*2,
                r:Math.random()*0.9+0.05,

                tw:Math.random()*Math.PI*2
            });
        }
        this.nebula=[];
        for(let i=0;i<5;i++){
            this.nebula.push({
                a:Math.random()*Math.PI*2,
                r:Math.random()*0.45+0.08,
                c:['rgba(80,30,160,','rgba(30,60,180,','rgba(160,40,120,','rgba(20,120,170,','rgba(140,50,190,'][i]
            });
        }
    }
    update(){
        this.phase+=0.016;
        this.x+=this.vx;
        this.y+=this.vy;
        this.rotate+=this.rotSpeed;
        this.targetSides=4+Math.floor(Math.abs(Math.sin(this.phase*0.5))*2);
        this.sides+=(this.targetSides-this.sides)*0.04;
        if(this.life<0.72){
            if(!this.crackData){
                this.crackData=makeMirrorCracks(this.size*0.58);
            }
            this.crackProgress=Math.min(1,this.crackProgress+0.09);
        }
        if(this.life<0.52){
            if(!this.shards){
                this.shards=makeMirrorShards(this.crackData,this.size*0.58);
            }
            this.shardProgress=Math.min(1,this.shardProgress+0.08);
        }
        if(this.life<0.30){
            this.voidProgress=Math.min(1,this.voidProgress+0.09);
        }
        if(this.shardProgress>0){
            this.size*=0.991;
            this.vx*=0.985;
            this.vy*=0.985;
        }
        this.life-=0.0028;
    }
    draw(){
        bCtx.save();
        bCtx.translate(this.x,this.y);
        bCtx.rotate(this.rotate);
        var alpha=this.life;
        var s=this.size;
        var sides=Math.round(this.sides);
        var cp=this.crackProgress;
        var sp=this.shardProgress;
        var vp=this.voidProgress;
        if(vp>0){
            var voidSize=s*(0.5+vp*1.15);
            var bgGrad=bCtx.createRadialGradient(0,0,0,0,0,voidSize);
            bgGrad.addColorStop(0,'rgba(0,0,3,'+(alpha*vp)+')');
            bgGrad.addColorStop(0.25,'rgba(2,1,10,'+(alpha*vp*0.98)+')');
            bgGrad.addColorStop(0.5,'rgba(5,3,20,'+(alpha*vp*0.95)+')');
            bgGrad.addColorStop(0.7,'rgba(12,6,38,'+(alpha*vp*0.75)+')');
            bgGrad.addColorStop(0.88,'rgba(22,12,58,'+(alpha*vp*0.4)+')');
            bgGrad.addColorStop(1,'rgba(0,0,0,0)');
            bCtx.fillStyle=bgGrad;
            bCtx.beginPath();
            bCtx.arc(0,0,voidSize,0,Math.PI*2);
            bCtx.fill();
            for(var nb of this.nebula){
                var nx=Math.cos(nb.a+this.phase*0.12)*voidSize*nb.r;
                var ny=Math.sin(nb.a+this.phase*0.12)*voidSize*nb.r;
                var nebGrad=bCtx.createRadialGradient(nx,ny,0,nx,ny,voidSize*0.3);
                nebGrad.addColorStop(0,nb.c+(alpha*vp*0.35)+')');
                nebGrad.addColorStop(1,nb.c+'0)');
                bCtx.fillStyle=nebGrad;
                bCtx.beginPath();
                bCtx.arc(nx,ny,voidSize*0.3,0,Math.PI*2);
                bCtx.fill();
            }
            for(var st of this.stars){
                var sx=Math.cos(st.a+this.phase*0.13)*voidSize*st.r;
                var sy=Math.sin(st.a+this.phase*0.13)*voidSize*st.r;
                var tw=0.4+0.6*Math.sin(this.phase*3.5+st.tw);
                bCtx.fillStyle='rgba(255,255,255,'+(alpha*vp*0.95*tw*(st.s/2.2))+')';
                bCtx.beginPath();
                bCtx.arc(sx,sy,st.s,0,Math.PI*2);
                bCtx.fill();
                if(st.s>1.1){
                    bCtx.strokeStyle='rgba(200,215,255,'+(alpha*vp*0.5*tw)+')';
                    bCtx.lineWidth=0.6;
                    bCtx.beginPath();
                    bCtx.moveTo(sx-st.s*3,sy);
                    bCtx.lineTo(sx+st.s*3,sy);
                    bCtx.moveTo(sx,sy-st.s*3);
                    bCtx.lineTo(sx,sy+st.s*3);
                    bCtx.stroke();
                }
            }
        }
        if(sp<0.88 && cp>0){
            bCtx.beginPath();
            for(var i=0;i<sides;i++){
                var angle=(Math.PI*2/sides)*i-Math.PI/2;
                var x=Math.cos(angle)*s/2;
                var y=Math.sin(angle)*s/2;
                i===0?bCtx.moveTo(x,y):bCtx.lineTo(x,y);
            }
            bCtx.closePath();
            bCtx.strokeStyle='rgba(255,255,255,'+(alpha*(1-sp*0.65)*0.75)+')';
            bCtx.lineWidth=1.6;
            bCtx.shadowColor='rgba(255,255,255,0.55)';
            bCtx.shadowBlur=7;
            bCtx.stroke();
            bCtx.shadowBlur=0;
        }
        if(cp>0 && sp<0.35 && this.crackData){
            bCtx.lineWidth=1;
            bCtx.shadowColor='rgba(220,230,255,0.75)';
            bCtx.shadowBlur=4;
            for(var crack of this.crackData.cracks){
                bCtx.strokeStyle='rgba(255,255,255,'+(alpha*cp*(1-sp*2.8)*(crack.main?0.95:0.6))+')';
                bCtx.beginPath();
                for(var ci=0;ci<crack.pts.length;ci++){
                    var p=crack.pts[ci];
                    ci===0?bCtx.moveTo(p.x,p.y):bCtx.lineTo(p.x,p.y);
                }
                bCtx.stroke();
            }
            bCtx.shadowBlur=0;
            bCtx.fillStyle='rgba(255,255,255,'+(alpha*cp*(1-sp*2.8)*0.9)+')';
            bCtx.beginPath();
            bCtx.arc(this.crackData.impact.x,this.crackData.impact.y,2.5,0,Math.PI*2);
            bCtx.fill();
        }
        if(sp>0 && this.shards){
            for(var sh of this.shards){
                sh.dist+=sh.speed*sp*0.65;
                sh.rot+=sh.rotSpeed;
                var dx=Math.cos(sh.dirA)*sh.dist*sp;
                var dy=Math.sin(sh.dirA)*sh.dist*sp;
                bCtx.save();
                bCtx.translate(dx,dy);
                bCtx.rotate(sh.rot);
                bCtx.beginPath();
                for(var si=0;si<sh.pts.length;si++){
                    var sp2=sh.pts[si];
                    si===0?bCtx.moveTo(sp2.x,sp2.y):bCtx.lineTo(sp2.x,sp2.y);
                }
                bCtx.closePath();
                bCtx.strokeStyle='rgba(255,255,255,'+(alpha*(1-vp)*0.7)+')';
                bCtx.lineWidth=1.1;
                bCtx.shadowColor='rgba(255,255,255,0.45)';
                bCtx.shadowBlur=4;
                bCtx.stroke();
                bCtx.shadowBlur=0;
                if(sh.highlight>0.6){
                    bCtx.strokeStyle='rgba(200,220,255,'+(alpha*(1-vp)*0.35)+')';
                    bCtx.lineWidth=0.6;
                    bCtx.beginPath();
                    var hp=sh.pts[Math.floor(sh.pts.length*0.3)];
                    bCtx.moveTo(sh.pts[0].x*0.3,sh.pts[0].y*0.3);
                    bCtx.lineTo(hp.x*0.7,hp.y*0.7);
                    bCtx.stroke();
                }
                bCtx.restore();
            }
        }
        bCtx.restore();
    }
}
function spawnBlock(count){
    for(var i=0;i<count;i++){
        blockList.push(new MirrorBreak());
    }
}
spawnBlock(12);
function blockLoop(){
    bCtx.clearRect(0,0,blockCanvas.width,blockCanvas.height);
    for(var i=blockList.length-1;i>=0;i--){
        var b=blockList[i];
        b.update();
        b.draw();
        if(b.life<=0){
            blockList.splice(i,1);
            if(Math.random()>0.55){
                spawnBlock(1);
            }
        }
    }
    requestAnimationFrame(blockLoop);
}
blockLoop();
setInterval(function(){
    spawnBlock(1);
},2600);

// 花瓣特效
const petalCanvas=document.getElementById('petalCanvas');
const pCtx=petalCanvas.getContext('2d');
let petals=[];
function resizePetal(){
    petalCanvas.width=window.innerWidth;
    petalCanvas.height=window.innerHeight;
}
resizePetal();
window.addEventListener('resize',resizePetal);
const petalColors=['#ff9ec7','#ffb3d9','#ff69b4','#ffc0cb','#ffd700','#ffffff'];
for(let i=0;i<120;i++){
    petals.push({
        x:Math.random()*petalCanvas.width,
        y:Math.random()*-petalCanvas.height,
        size:Math.random()*10+5,
        speed:Math.random()*1.2+0.4,
        sway:Math.random()*Math.PI*2,
        color:petalColors[Math.floor(Math.random()*petalColors.length)],
        rot:Math.random()*Math.PI*2,
        rotSpeed:(Math.random()-0.5)*0.02
    });
}
function petalLoop(){
    pCtx.clearRect(0,0,petalCanvas.width,petalCanvas.height);
    for(let petal of petals){
        petal.y+=petal.speed;
        petal.sway+=0.015;
        petal.x+=Math.sin(petal.sway)*1.2;
        petal.rot+=petal.rotSpeed;
        pCtx.save();
        pCtx.translate(petal.x,petal.y);
        pCtx.rotate(petal.rot);
        pCtx.fillStyle=petal.color;
        pCtx.globalAlpha=0.85;
        pCtx.beginPath();
        pCtx.ellipse(0,0,petal.size,petal.size*0.6,0,0,Math.PI*2);
        pCtx.fill();
        pCtx.restore();
        if(petal.y>petalCanvas.height){
            petal.y=-petal.size;
            petal.x=Math.random()*petalCanvas.width;
        }
    }
    requestAnimationFrame(petalLoop);
}
petalLoop();

// 星光特效
const sparkleCanvas=document.getElementById('sparkleCanvas');
const sCtx=sparkleCanvas.getContext('2d');
let sparkles=[];
function resizeSparkle(){
    sparkleCanvas.width=window.innerWidth;
    sparkleCanvas.height=window.innerHeight;
}
resizeSparkle();
window.addEventListener('resize',resizeSparkle);
const sparkleColors=['#ffffff','#ffd700','#ff9ec7','#ff69b4','#bb66ff'];
for(let i=0;i<80;i++){
    sparkles.push({
        x:Math.random()*sparkleCanvas.width,
        y:Math.random()*sparkleCanvas.height,
        size:Math.random()*3+1,
        twinkle:Math.random()*Math.PI*2,
        color:sparkleColors[Math.floor(Math.random()*sparkleColors.length)]
    });
}
function sparkleLoop(){
    sCtx.clearRect(0,0,sparkleCanvas.width,sparkleCanvas.height);
    for(let sp of sparkles){
        sp.twinkle+=0.025;
        var alpha=0.4+0.6*Math.sin(sp.twinkle);
        sCtx.fillStyle=sp.color;
        sCtx.globalAlpha=alpha;
        sCtx.beginPath();
        sCtx.arc(sp.x,sp.y,sp.size,0,Math.PI*2);
        sCtx.fill();
        if(Math.random()<0.008){
            sp.x=Math.random()*sparkleCanvas.width;
            sp.y=Math.random()*sparkleCanvas.height;
        }
    }
    requestAnimationFrame(sparkleLoop);
}
sparkleLoop();

// 爱心漂浮
function burstHearts(x,y,n){
    for(let i=0;i<n;i++){
        let heart=document.createElement('div');
        heart.className='heart-float';
        heart.textContent=['✨','💖','🌸','⭐','💗','🌟'][Math.floor(Math.random()*6)];
        heart.style.left=(x + (Math.random()-0.5)*40)+'px';
        heart.style.top=(y + Math.random()*20)+'px';
        document.body.appendChild(heart);
        setTimeout(function(){heart.remove();},1800);
    }
}

// 卡片悬停爱心
document.querySelectorAll('.item').forEach(function(item){
    item.addEventListener('mouseenter',function(){
        for(let i=0;i<6;i++){
            let rect = item.getBoundingClientRect();
            burstHearts(
                rect.left + Math.random()*rect.width,
                rect.top + rect.height/2,
                1
            );
        }
    });
});
</script>
